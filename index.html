<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Product List</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <header class="header">
        <div class="container">
            <h1 class="logo">Store</h1>
            <nav class="nav">
                <span>Danh Sách Sản Phẩm</span>
            </nav>
        </div>
    </header>

    <main class="container">
        <!-- Thanh tìm kiếm và lọc -->
        <div class="search-sort-bar" style="display: flex; align-items: center; gap: 12px; margin: 32px 0 24px 0;">
            <input type="text" id="searchInput" placeholder="Tìm kiếm sản phẩm..." class="search-input" oninput="onSearchChanged()">
            <div class="dropdown">
                <button class="sort-btn" id="sortDropdownBtn" onclick="toggleSortDropdown()">
                    <span style="font-size: 18px;">&#x25BC;</span>
                </button>
                <div id="sortDropdown" class="dropdown-content">
                    <a href="#" onclick="sortProducts('nameAsc')">Tên A→Z</a>
                    <a href="#" onclick="sortProducts('nameDesc')">Tên Z→A</a>
                    <a href="#" onclick="sortProducts('priceAsc')">Giá tăng</a>
                    <a href="#" onclick="sortProducts('priceDesc')">Giá giảm</a>
                </div>
            </div>
        </div>
        <div class="products-grid" id="product-list"></div>
        <!-- Bảng quản lý sản phẩm -->
        <div class="table-responsive mt-5">
            <table class="table table-striped table-hover">
                <thead class="table-dark">
                    <tr>
                        <th>Hình ảnh</th>
                        <th>Tên sản phẩm</th>
                        <th>Mô tả</th>
                        <th>Giá</th>
                        <th>Danh mục</th>
                    </tr>
                </thead>
                <tbody id="product-table-body">
                    <!-- Populate bằng JS -->
                </tbody>
            </table>
        </div>
    </main>

    <footer class="footer">
        <p>&copy; 2026 Modern Store. All rights reserved.</p>
    </footer>

    <script src="script.js"></script>
</body>
</html>
